<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="favicon.png">
  <title>Project Liminal Vertigo</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Creepster&family=VT323&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #ddd;
      font-family: 'VT323', monospace;
      overflow: hidden;
      height: 100vh;
      position: relative;
    }

    /* Flickering Background */
    .bg {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(rgba(0,0,0,0.8), rgba(20,0,0,0.6)),
                  url('https://via.placeholder.com/1920x1080/1a0000/330000?text=LIMINAL+SPACE') center/cover;
      animation: flicker 4s infinite alternate;
    }

    @keyframes flicker {
      0%   { opacity: 0.85; }
      50%  { opacity: 0.95; }
      100% { opacity: 0.82; }
    }

    .vignette {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.9) 90%);
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 10;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-family: 'Creepster', cursive;
      font-size: 4.5rem;
      color: #00ffff;
      text-shadow: 0 0 20px #002222,
                   0 0 40px #880000;
      letter-spacing: 8px;
      margin-bottom: 1rem;
      animation: glitch 2s infinite;
    }

    .subtitle {
      font-size: 1.8rem;
      color: #aaa;
      margin-bottom: 3rem;
      letter-spacing: 4px;
    }

    .enter-btn {
      padding: 18px 60px;
      font-size: 1.6rem;
      background: transparent;
      color: #ffdddd;
      border: 2px solid #ff4444;
      cursor: pointer;
      transition: all 0.4s;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    .enter-btn:hover {
      background: #ff0000;
      color: #000;
      box-shadow: 0 0 30px #ff4444;
      transform: scale(1.05);
    }

    .scanline {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 100%;
      background: linear-gradient(transparent, rgba(255,255,255,0.07), transparent);
      animation: scan 6s linear infinite;
      pointer-events: none;
    }

    @keyframes glitch {
      0% { transform: translate(0); }
      20% { transform: translate(-3px, 3px); }
      40% { transform: translate(3px, -3px); }
      60% { transform: translate(-2px, 2px); }
      100% { transform: translate(0); }
    }

    @keyframes scan {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(300%); }
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="vignette"></div>
  <div class="scanline"></div>

  <div class="content">
    <h1>PROJECT LIMINAL VERTIGO</h1>
    <p class="subtitle">YOU ARE NOT SUPPOSED TO BE HERE</p>
    
    <button class="enter-btn" onclick="enterRift()">ENTER THE RIFT</button>
    
    <p style="margin-top: 4rem; font-size: 1.1rem; opacity: 0.6;">
      DigitalPhoenix Studio • A Procedural Horror Experience
    </p>
  </div>

  <script>
    function enterRift() {
      const versions = [
        "https://digitalphoenix3d.github.io/ProjectLiminalVertigo/site01/index.html",
        "https://digitalphoenix3d.github.io/ProjectLiminalVertigo/site02/index.html",
        "https://digitalphoenix3d.github.io/ProjectLiminalVertigo/site03/index.html",
        "https://digitalphoenix3d.github.io/ProjectLiminalVertigo/site04/index.html",
        // Add all your versions here
      ];

      const random = versions[Math.floor(Math.random() * versions.length)];
      window.location.href = random;
    }

    // Optional: Random flickering sound or text effect can be added later
  </script>
</body>
</html>
